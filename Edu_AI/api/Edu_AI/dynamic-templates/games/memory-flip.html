<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>翻牌记忆游戏</title>
  <style>
    :root {
      --bg: #edf4f4;
      --panel: rgba(246, 251, 251, 0.9);
      --ink: #183247;
      --muted: #648094;
      --line: rgba(24, 50, 71, 0.14);
      --accent: #0d7d86;
      --accent-soft: rgba(13, 125, 134, 0.12);
      --success: #2d7f53;
      --shadow: 0 24px 70px rgba(24, 50, 71, 0.14);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(13, 125, 134, 0.18), transparent 28%),
        radial-gradient(circle at bottom right, rgba(33, 97, 173, 0.14), transparent 24%),
        linear-gradient(180deg, #f7fcfc 0%, var(--bg) 100%);
    }

    .shell {
      width: min(1380px, calc(100vw - 56px));
      margin: 28px auto;
      padding: 30px 32px 34px;
      border-radius: 32px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .eyebrow {
      font-size: 14px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 12px 0 8px;
      font-size: clamp(30px, 4vw, 50px);
      line-height: 1.08;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 24px;
      color: var(--muted);
      font-size: 17px;
    }

    .grid {
      margin-top: 26px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    .memory-card {
      position: relative;
      aspect-ratio: 4 / 3;
      border: 0;
      padding: 0;
      perspective: 1200px;
      background: transparent;
      cursor: pointer;
    }

    .memory-card[disabled] { cursor: default; }

    .memory-card.is-solved { filter: saturate(0.9); }

    .memory-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 420ms ease;
    }

    .memory-card.is-open .memory-card-inner,
    .memory-card.is-solved .memory-card-inner {
      transform: rotateY(180deg);
    }

    .memory-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-radius: 24px;
      border: 1px solid var(--line);
      backface-visibility: hidden;
      box-shadow: 0 16px 34px rgba(24, 50, 71, 0.1);
    }

    .memory-face.front {
      background:
        linear-gradient(145deg, rgba(255,255,255,0.94), rgba(229, 244, 245, 0.92));
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 14px;
    }

    .memory-face.front::after {
      content: "翻开";
      font-size: 28px;
      color: var(--accent);
      letter-spacing: 0.12em;
    }

    .memory-face.back {
      transform: rotateY(180deg);
      background: #fffefa;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
    }

    .summary {
      margin-top: 22px;
      font-size: 18px;
      color: var(--muted);
    }

    .celebration {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(13, 26, 39, 0.26);
      backdrop-filter: blur(4px);
    }

    .celebration.show { display: grid; }

    .celebration-card {
      position: relative;
      min-width: min(520px, calc(100vw - 48px));
      padding: 34px 32px;
      border-radius: 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 28px 60px rgba(12, 30, 44, 0.2);
    }

    .celebration h2 { margin: 0 0 10px; font-size: 40px; }
    .celebration p { margin: 0; color: var(--muted); font-size: 18px; }

    .confetti {
      position: absolute;
      inset: -12px;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti span {
      position: absolute;
      top: -20px;
      width: 10px;
      height: 26px;
      border-radius: 999px;
      opacity: 0.84;
      animation: fall 1600ms linear infinite;
    }

    @keyframes fall {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(420px) rotate(320deg); }
    }

    @media (max-width: 900px) {
      .shell { width: min(100vw - 24px, 1380px); padding: 22px 18px 26px; }
      .meta { flex-wrap: wrap; gap: 10px 18px; }
      .memory-face.back { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">Memory Flip</div>
    <h1 id="game-title"></h1>
    <div class="meta">
      <span>每次只能翻两张</span>
      <span>失配后 0.8 秒自动翻回</span>
      <span id="move-count">已尝试 0 次</span>
    </div>
    <section class="grid" id="grid"></section>
    <div class="summary" id="summary">找到所有配对即可通关。</div>

    <section class="celebration" id="celebration">
      <div class="celebration-card">
        <div class="confetti" id="confetti"></div>
        <h2>通关成功</h2>
        <p>你已经完成全部记忆配对，可以继续复盘本页核心概念。</p>
      </div>
    </section>
  </main>

  <script>
    const GAME_DATA = __GAME_DATA_JSON__;
    const state = {
      moves: 0,
      openIds: [],
      solvedIds: new Set(),
      lock: false,
      deck: GAME_DATA.matches.flatMap((item, index) => ([
        { id: `${item.pair_id}-a-${index}`, pairId: String(item.pair_id), text: item.card_a },
        { id: `${item.pair_id}-b-${index}`, pairId: String(item.pair_id), text: item.card_b },
      ])).sort(() => Math.random() - 0.5),
    };

    const grid = document.getElementById('grid');
    const summary = document.getElementById('summary');
    const moveCount = document.getElementById('move-count');
    const celebration = document.getElementById('celebration');
    document.getElementById('game-title').textContent = GAME_DATA.title;

    function renderConfetti() {
      const container = document.getElementById('confetti');
      const colors = ['#0d7d86', '#ffbf47', '#f16b5b', '#2d7f53', '#1d5ea8'];
      container.innerHTML = '';
      for (let i = 0; i < 22; i += 1) {
        const piece = document.createElement('span');
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = `${Math.random() * 1.2}s`;
        piece.style.animationDuration = `${1.2 + Math.random() * 1.1}s`;
        container.appendChild(piece);
      }
    }

    function isOpen(cardId) {
      return state.openIds.includes(cardId);
    }

    function render() {
      moveCount.textContent = `已尝试 ${state.moves} 次`;
      grid.innerHTML = '';
      state.deck.forEach((card) => {
        const button = document.createElement('button');
        button.className = 'memory-card';
        if (isOpen(card.id)) button.classList.add('is-open');
        if (state.solvedIds.has(card.pairId)) button.classList.add('is-solved');
        button.disabled = state.lock;
        button.innerHTML = `
          <div class="memory-card-inner">
            <div class="memory-face front"></div>
            <div class="memory-face back">${card.text}</div>
          </div>
        `;
        button.addEventListener('click', () => handleFlip(card.id));
        grid.appendChild(button);
      });
    }

    function revealSolvedState(pairId) {
      const solvedCount = state.solvedIds.size;
      summary.textContent = `已完成 ${solvedCount}/${GAME_DATA.matches.length} 组配对。`;
      if (solvedCount === GAME_DATA.matches.length) {
        renderConfetti();
        celebration.classList.add('show');
        summary.textContent = '全部配对完成。';
      }
    }

    async function handleFlip(cardId) {
      if (state.lock || isOpen(cardId)) return;
      const card = state.deck.find((item) => item.id === cardId);
      if (!card || state.solvedIds.has(card.pairId)) return;

      state.openIds = [...state.openIds, cardId];
      render();

      if (state.openIds.length < 2) return;

      state.moves += 1;
      const [first, second] = state.openIds.map((id) => state.deck.find((item) => item.id === id));
      state.lock = true;
      summary.textContent = '正在比对两张卡片...';

      await new Promise((resolve) => setTimeout(resolve, 800));

      if (first.pairId === second.pairId) {
        state.solvedIds.add(first.pairId);
        summary.textContent = '匹配成功。';
        revealSolvedState(first.pairId);
      } else {
        summary.textContent = '未匹配成功，请继续尝试。';
      }

      state.openIds = [];
      state.lock = false;
      render();
    }

    render();
  </script>
</body>
</html>
