<div class="slide layout-thesis-evidence-grid">
  <div class="header-area">
    <div class="title-en">THESIS EVIDENCE</div>
    <div class="title-main">先亮结论，再并列展开证据</div>
    <div class="title-divider"></div>
  </div>

  <div class="content-area">
    <div class="surface-card thesis-band structured-lead">
      <div class="structured-kicker thesis-band-kicker">Main Thesis</div>
      <div class="structured-lead-text thesis-band-text">先给出一句核心判断，再用 3 到 4 张证据卡并列支撑，避免把“原因”误讲成流程。</div>
    </div>

    <div class="thesis-evidence-grid">
      <div class="surface-card evidence-card">
        <div class="evidence-card-head">
          <div class="process-index evidence-card-index">01</div>
          <div class="card-title evidence-card-title">证据一</div>
        </div>
        <div class="card-desc evidence-card-text">给出第一条关键理由，直接支撑 thesis，而不是另起话题。</div>
        <div class="card-subtitle evidence-card-note">补充：这一格适合放限制、条件或课堂提示。</div>
      </div>

      <div class="surface-card evidence-card">
        <div class="evidence-card-head">
          <div class="process-index evidence-card-index">02</div>
          <div class="card-title evidence-card-title">证据二</div>
        </div>
        <div class="card-desc evidence-card-text">第二条理由最好与第一条形成不同维度，例如效率、效果或机制。</div>
        <div class="card-subtitle evidence-card-note">补充：并列但不抢主结论的位置。</div>
      </div>

      <div class="surface-card evidence-card">
        <div class="evidence-card-head">
          <div class="process-index evidence-card-index">03</div>
          <div class="card-title evidence-card-title">证据三</div>
        </div>
        <div class="card-desc evidence-card-text">第三条理由可以承接风险、边界条件或实现必要性。</div>
        <div class="card-subtitle evidence-card-note">补充：适合放课堂上的反问句或类比。</div>
      </div>

      <div class="surface-card evidence-card">
        <div class="evidence-card-head">
          <div class="process-index evidence-card-index">04</div>
          <div class="card-title evidence-card-title">证据四</div>
        </div>
        <div class="card-desc evidence-card-text">当内容足够密时，再补第四条证据；否则保留三张即可。</div>
        <div class="card-subtitle evidence-card-note">补充：不要让这张卡变成新的总论点。</div>
      </div>
    </div>
  </div>

  <div class="footer-area">
    <div class="footer-page">11</div>
  </div>
</div>
