<div class="slide layout-standard-text-process">
  <div class="header-area">
    <div class="title-en">PROCESS THREAD</div>
    <div class="title-main">把一个复杂问题组织成清晰的阶段路径</div>
    <div class="title-divider"></div>
  </div>

  <div class="content-area">
    <div class="process-track">
      <div class="surface-card process-step">
        <div class="process-index">01</div>
        <div class="process-copy">
          <div class="card-title">建立基线</div>
          <div class="card-subtitle">明确起点与评估标准。</div>
        </div>
      </div>

      <div class="process-divider"></div>

      <div class="surface-card process-step">
        <div class="process-index">02</div>
        <div class="process-copy">
          <div class="card-title">切入痛点</div>
          <div class="card-subtitle">把核心矛盾拆成可执行任务。</div>
        </div>
      </div>

      <div class="process-divider"></div>

      <div class="surface-card process-step">
        <div class="process-index">03</div>
        <div class="process-copy">
          <div class="card-title">沉淀成果</div>
          <div class="card-subtitle">形成方法、系统或结论闭环。</div>
        </div>
      </div>
    </div>

    <div class="quote-box">
      <div class="quote-accent"></div>
      <div class="quote-text">流程型页面的关键，不只是列出 1、2、3，而是让观众一眼看到“先后关系、阶段推进与目标递进”。</div>
    </div>

    <div class="surface-card text-details">
      <div class="list-item">顶部流程轨道适合放 3 个短阶段、步骤、训练阶段或研究里程碑。</div>
      <div class="list-item">下方引言框承载整条路径的总判断，详细卡片负责补充每个阶段的任务与目标。</div>
      <div class="list-item">如果是 4 到 5 步流程，应改用 process-grid，而不是把横向轨道挤得过密。</div>
    </div>
  </div>

  <div class="footer-area">
    <div class="footer-page">08</div>
  </div>
</div>
