<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>body{margin:0;font:16px/1.7 system-ui;background:#f5f8fa;color:#203e42}main{padding:16px}.simulation-panel{padding:20px;background:white;border-radius:14px}h2{margin:0 0 16px;font-size:22px}canvas{width:100%;height:560px;display:block;background:#f5f8fa;border-radius:12px}.metrics{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0}</style></head><body><main><section class="simulation-panel"><h2>可视化模拟</h2><div><canvas id="scene" aria-label="实验状态图"></canvas></div><div class="metrics" id="metrics"></div><div data-guidance-feedback></div><div data-guidance-controls></div><details data-guidance-history></details></section></main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let latest;
function draw(model,context){latest=[model,context];const w=canvas.clientWidth,h=560,dpr=devicePixelRatio;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.font='14px system-ui';ctx.textAlign='center';if(context.kind==='quicksort'){const max=Math.max(1,...model.array.map(Math.abs)),step=w/model.array.length;model.array.forEach((v,i)=>{const height=Math.abs(v)/max*430;ctx.fillStyle=i===model.selected?'#ecae49':i===model.scan&&model.phase==='scan'?'#238778':'#a5c5bc';ctx.fillRect(i*step+5,480-height,step-10,height);ctx.fillStyle='#203e42';ctx.fillText(String(v),i*step+step/2,465-height);ctx.fillText(String(i+1),i*step+step/2,510);});document.querySelector('#metrics').textContent=`比较 ${model.comparisons} 次 · 交换 ${model.swaps} 次`;}else{ctx.fillStyle='#203e42';ctx.fillRect(20,400,w-40,3);const x=20+Math.min(1,model.distance/210)*(w-90);ctx.fillStyle='#238778';ctx.fillRect(x,340,50,45);ctx.fillStyle='#203e42';ctx.beginPath();ctx.arc(x+10,390,8,0,7);ctx.arc(x+40,390,8,0,7);ctx.fill();ctx.fillText(model.distance.toFixed(2)+' m',w/2,450);document.querySelector('#metrics').textContent=`时间 ${model.time.toFixed(2)} s · 距离 ${model.distance.toFixed(2)} m`;}}
new ResizeObserver(()=>{if(latest)draw(...latest)}).observe(canvas.parentElement);EduGuidance.register({render:draw});
</script></body></html>
