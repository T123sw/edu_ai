# SearXNG configuration — internal image search backend
# Documentation: https://docs.searxng.org/admin/settings/index.html
#
# IMPORTANT: the secret_key below was generated locally for this deployment.
# Do not commit a real secret key for production; regenerate per env.

use_default_settings: true

general:
  instance_name: "edu-ai-internal"
  enable_metrics: false

server:
  secret_key: "7a48de4640d15aae9b0cadd78a855029adf59eb3402ac9dddce9532fa5fcde36"
  limiter: false
  image_proxy: false
  http_protocol_version: "1.1"

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

# Engine selection — keep only image-capable engines enabled to reduce cold-start latency.
# Other categories (general/news/videos) remain available via default settings but are not our use case.
engines:
  - name: bing images
    disabled: false
  - name: duckduckgo images
    disabled: false
  - name: google images
    disabled: false
  - name: brave.images
    disabled: false
